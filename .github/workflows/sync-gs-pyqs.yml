name: Sync UPSC GS PYQ bank

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/import_gs_pyqs.py"
      - ".github/workflows/sync-gs-pyqs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-gs-pyqs"
  cancel-in-progress: false

jobs:
  import-gs-pyqs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Import GS Paper I questions from 2013 onward
        run: python scripts/import_gs_pyqs.py
      - name: Commit refreshed question bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions.json
          if git diff --cached --quiet; then
            echo "Question bank is already up to date."
          else
            git commit -m "Import UPSC GS Paper I PYQs (2013 onward)"
            git push
          fi
