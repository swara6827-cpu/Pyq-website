name: Import UPSC GS question bank

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/import_gs_pyqs.py"
      - "scripts/import_gs_bank.py"
      - ".github/workflows/sync-gs-pyqs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "gs-pyq-source-library"
  cancel-in-progress: false

jobs:
  build-source-directory:
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Import full GS Paper I question bank
        run: python scripts/import_gs_bank.py
      - name: Commit source directory if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gs questions.json
          if git diff --cached --quiet; then
            echo "Question bank is already up to date."
          else
            git commit -m "Import UPSC GS Paper I questions and explanations (2013 onward)"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
