name: Refresh GS PYQ source library

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/import_gs_pyqs.py"
      - ".github/workflows/sync-gs-pyqs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gs-pyq-source-library"
  cancel-in-progress: false

jobs:
  build-source-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build metadata-only GS source directory
        run: python scripts/import_gs_pyqs.py
      - name: Commit source directory if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyq-sources.json
          if git diff --cached --quiet; then
            echo "GS source directory is already up to date."
          else
            git commit -m "Refresh GS PYQ source directory (2013 onward)"
            git push
          fi
